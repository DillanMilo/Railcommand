name: CI

on:
  pull_request:

env:
  EXPO_PUBLIC_BUILD_PROFILE: development
  EXPO_PUBLIC_SUPABASE_URL: https://cyacardivfzrsravqjto.supabase.co
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-publishable-key-placeholder
  EXPO_PUBLIC_API_BASE_URL: https://railcommand-mobile-staging.vercel.app
  EXPO_PUBLIC_EXPECTED_SUPABASE_PROJECT_REF: cyacardivfzrsravqjto
  EXPO_PUBLIC_EXPECTED_API_HOST: railcommand-mobile-staging.vercel.app
  EXPO_PUBLIC_BLOCKED_SUPABASE_PROJECT_REFS: production-placeholder
  EXPO_PUBLIC_BLOCKED_API_HOSTS: railcommand.io
  MOBILE_BUILD_PROFILE: development
  MOBILE_APP_ID: io.railcommand.app.dev
  MOBILE_EXPECTED_APP_ID: io.railcommand.app.dev
  MOBILE_EXPECTED_SUPABASE_PROJECT_REF: cyacardivfzrsravqjto
  MOBILE_BLOCKED_SUPABASE_PROJECT_REFS: production-placeholder
  MOBILE_EXPECTED_APP_HOST: railcommand-mobile-staging.vercel.app
  MOBILE_BLOCKED_APP_HOSTS: railcommand.io
  MOBILE_APP_VERSION: 0.3.0
  MOBILE_BUILD_NUMBER: "300001"
  NEXT_PUBLIC_SUPABASE_URL: https://cyacardivfzrsravqjto.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-publishable-key-placeholder
  NEXT_PUBLIC_APP_URL: https://railcommand-mobile-staging.vercel.app

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

  mobile-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify environment isolation
        run: npm run test:mobile-env

      - name: Test mobile contracts and foundation
        run: npm run test:mobile

      - name: Validate Expo dependency and native configuration
        working-directory: apps/mobile
        run: npx expo-doctor@1.20.3

      - name: Verify mobile icon and splash inventory
        run: npm run verify:mobile:assets

      - name: Build bundled mobile assets
        run: npm run mobile:build

  android-unsigned:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project with Expo CNG
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install --clean

      - name: Test Android project
        working-directory: apps/mobile/android
        env:
          NODE_ENV: test
        run: ./gradlew :app:testDebugUnitTest

      - name: Assemble unsigned Android debug application
        working-directory: apps/mobile/android
        env:
          NODE_ENV: development
        run: ./gradlew assembleDebug

  ios-simulator-unsigned:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate iOS project and install CocoaPods with Expo CNG
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --clean

      - name: Build unsigned iOS Simulator application
        working-directory: apps/mobile
        run: >-
          xcodebuild -workspace ios/RailCommandDevelopment.xcworkspace
          -scheme RailCommandDevelopment -sdk iphonesimulator
          -configuration Debug CODE_SIGNING_ALLOWED=NO build
