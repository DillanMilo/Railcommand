name: CI

on:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Database grants and isolated PostgreSQL permissions
        run: npm run check:db-grants && npm run test:db-grants

      - name: Inventory finance rollout compatibility
        run: npm run test:inventory && node scripts/test-inventory-finance-bridge.mjs && node scripts/test-inventory-contract-db.mjs && node scripts/test-inventory-catalogue-db.mjs

      - name: Web/mobile action inventory
        run: node scripts/verify-web-mobile-parity.mjs

      - name: Authentication and mobile backend compatibility
        run: node --import tsx node_modules/mocha/bin/mocha.js 'src/lib/auth/*.test.ts' 'src/lib/mobile-api/*.test.ts'

      - name: Project photo pagination and upload preservation
        run: npm run test:project-photos

      - name: Native field tools and workspace checks
        if: ${{ hashFiles('apps/mobile/package.json') != '' }}
        run: |
          npm ci --prefix apps/mobile
          npm run typecheck --prefix apps/mobile
          npm run test --prefix apps/mobile

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Isolated beta account security and retry checks
        run: npm run test:beta-accounts
